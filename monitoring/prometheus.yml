global:
  scrape_interval: 10s

scrape_configs:
  - job_name: client
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["client:8080"]

  - job_name: service1
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["service1:8080"]

  - job_name: service2
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["service2:8080"]

  - job_name: zookeeper
    metrics_path: /metrics
    static_configs:
      - targets: ["zookeeper:7070"]

services:
  zookeeper:
    image: zookeeper:3.9
    environment:
      ZOO_CFG_EXTRA: "metricsProvider.className=org.apache.zookeeper.metrics.prometheus.PrometheusMetricsProvider metricsProvider.httpPort=7070"
    ports:
      - "2181:2181"
      - "7070:7070"

  pact-broker-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pact_broker
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: pact
    ports:
      - "5432:5432"
    volumes:
      - pact-broker-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact -d pact_broker"]
      interval: 5s
      timeout: 5s
      retries: 10

  pact-broker:
    image: pactfoundation/pact-broker:latest
    depends_on:
      pact-broker-db:
        condition: service_healthy
    environment:
      PACT_BROKER_DATABASE_ADAPTER: postgres
      PACT_BROKER_DATABASE_HOST: pact-broker-db
      PACT_BROKER_DATABASE_NAME: pact_broker
      PACT_BROKER_DATABASE_USERNAME: pact
      PACT_BROKER_DATABASE_PASSWORD: pact
      PACT_BROKER_BASE_URL: http://host.docker.internal:9292
    ports:
      - "9292:9292"
    restart: on-failure

  pact-consumer-tests:
    image: maven:3.9.9-eclipse-temurin-11
    working_dir: /workspace/rate-printer
    volumes:
      - .:/workspace
    depends_on:
      - pact-broker
    command:
      - ./mvnw
      - test
      - -Dpact.publish.enabled=true
      - -Dpactbroker.url=http://pact-broker:9292
      - -Dpact.consumer.version=1.0.0

  service1:
    build:
      context: ./currency-rate-provider
      args:
        PACT_BROKER_URL: http://host.docker.internal:9292
    image: currency-rate-provider:local
    environment:
      ZOOKEEPER_CONNECT_STRING: zookeeper:2181
      GRPC_PORT: 9090
    depends_on:
      - zookeeper
      - pact-broker
    restart: on-failure

  service2:
    image: currency-rate-provider:local
    environment:
      ZOOKEEPER_CONNECT_STRING: zookeeper:2181
      GRPC_PORT: 9090
    depends_on:
      - zookeeper
      - pact-broker
      - service1
    restart: on-failure

  client:
    build:
      context: ./rate-printer
    image: rate-printer:local
    environment:
      ZOOKEEPER_CONNECT_STRING: zookeeper:2181
      SPRING_APPLICATION_NAME: client
      CLIENT_ID: client
    depends_on:
      - zookeeper
      - service1
      - service2
    restart: on-failure

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - client
      - service1
      - service2
      - zookeeper

  grafana:
    image: grafana/grafana:10.4.5
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pact-broker-db-data:

spring:
  application:
    name: currency-rate-provider
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  cloud:
    zookeeper:
      connect-string: ${ZOOKEEPER_CONNECT_STRING:localhost:2181}
      discovery:
        enabled: true
        register: true
        instance-port: ${grpc.server.port}

server:
  port: ${HTTP_PORT:8080}
  shutdown: graceful

grpc:
  server:
    port: ${GRPC_PORT:9090}
    shutdown-grace-period: ${GRPC_SHUTDOWN_GRACE_PERIOD:30s}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        grpc.server.requests: true
      percentiles:
        grpc.server.requests: 0.5,0.95,0.99
